<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAKVIM — Ozlem Burosu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#1B1035;
    --night2:#241145;
    --pink:#FF2E88;
    --yellow:#FFD23F;
    --tangerine:#FF6B35;
    --cream:#FFF6E9;
    --cream-dim:#D9CFEE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--night);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,46,136,0.18), transparent 40%),
      radial-gradient(circle at 85% 75%, rgba(255,210,63,0.14), transparent 45%);
    color:var(--cream);
    font-family:'Space Grotesk', sans-serif;
    overflow-x:hidden;
    min-height:100vh;
    padding-bottom:60px;
  }
  h1,h2,.display{
    font-family:'Bungee', cursive;
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .stripe{
    background:repeating-linear-gradient(45deg, var(--yellow), var(--yellow) 14px, var(--night2) 14px, var(--night2) 28px);
    height:14px;
    width:100%;
  }
  .wrap{max-width:780px;margin:0 auto;padding:0 20px;}

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:28px;
    margin-bottom:8px;
  }
  .back-link{
    display:inline-block;
    text-decoration:none;
    font-family:'Bungee', cursive;
    font-size:12px;
    letter-spacing:1px;
    color:var(--night);
    background:var(--cream);
    border:2px solid var(--yellow);
    border-radius:6px;
    padding:8px 12px;
  }
  .back-link:hover{background:var(--yellow);}
  .page-title{text-align:center; margin:18px 0 6px;}
  .page-title h1{
    font-size:42px;
    color:var(--yellow);
    margin:0;
    text-shadow:3px 3px 0 var(--pink);
  }
  .page-sub{
    text-align:center;
    color:var(--cream-dim);
    font-size:13px;
    margin-bottom:24px;
  }

  /* TAKVIM */
  .calendar-box{
    background:var(--night2);
    border:2px solid var(--pink);
    border-radius:10px;
    padding:18px 16px;
    margin-bottom:24px;
  }
  .calendar-nav{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .calendar-nav button{
    background:var(--night); border:2px solid var(--yellow); color:var(--yellow);
    width:36px; height:36px; border-radius:8px; font-size:16px; cursor:pointer;
    font-family:'Space Grotesk', sans-serif;
  }
  .calendar-nav button:hover{background:var(--yellow); color:var(--night);}
  .calendar-month-label{font-family:'Bungee', cursive; color:var(--yellow); font-size:16px; letter-spacing:1px;}
  .calendar-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .calendar-dow{text-align:center; font-size:11px; color:var(--cream-dim); letter-spacing:1px; padding-bottom:4px;}
  .calendar-day{
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--night); border:2px solid transparent; border-radius:8px;
    font-size:13px; cursor:pointer; position:relative; color:var(--cream);
  }
  .calendar-day.empty{visibility:hidden; cursor:default;}
  .calendar-day.today{border-color:var(--cream-dim);}
  .calendar-day:not(.empty):hover{border-color:var(--tangerine);}
  .calendar-day.marked{background:var(--pink); color:var(--night); font-weight:700;}
  .calendar-day.selected{border-color:var(--yellow);}
  .calendar-day .dot{width:5px; height:5px; border-radius:50%; background:var(--yellow); margin-top:3px;}

  /* EDITOR */
  .day-editor{
    background:var(--night2); border:2px solid var(--yellow); border-radius:10px;
    padding:16px; margin-bottom:24px; display:none;
  }
  .day-editor.show{display:block;}
  .day-editor-title{font-family:'Bungee', cursive; color:var(--yellow); font-size:15px; margin-bottom:12px;}
  .day-editor label.mark-label{display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:14px; color:var(--cream-dim);}
  
  .note-form{
    display:flex; flex-direction:column; gap:8px;
    background:var(--night); border:1px dashed var(--pink); border-radius:8px; padding:12px; margin-bottom:16px;
  }
  .note-form select, .note-form textarea{
    font-family:'Space Grotesk', sans-serif;
    background:var(--night2); color:var(--cream); border:1px solid var(--cream-dim);
    border-radius:6px; padding:8px 10px; font-size:13px;
  }
  .note-form textarea{resize:vertical; min-height:50px;}
  .note-form button{
    font-family:'Bungee', cursive; background:var(--yellow); color:var(--night);
    border:none; border-radius:6px; padding:9px; font-size:12px; cursor:pointer;
  }
  .note-form button:disabled{opacity:0.55; cursor:not-allowed;}

  .notes-list{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .note-item{
    background:var(--night); border-left:3px solid var(--tangerine); border-radius:6px;
    padding:8px 10px; font-size:13px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
  }
  .note-item .who{font-family:'Bungee', cursive; font-size:11px; color:var(--yellow); margin-bottom:2px;}
  .note-item .txt{color:var(--cream); word-break:break-word; line-height:1.4;}
  .note-item .del-btn{
    font-family:'Bungee', cursive; font-size:9px; background:transparent;
    color:var(--pink); border:1px solid var(--pink); border-radius:4px; padding:2px 6px; cursor:pointer; flex-shrink:0;
  }
  .note-item .del-btn:hover{background:var(--pink); color:var(--night);}

  .day-editor-status{font-size:12px; color:var(--cream-dim); margin-top:8px; min-height:16px;}

  .upcoming-title{
    text-align:center;
    font-size:18px;
    color:var(--cream-dim);
    margin-bottom:16px;
  }
  .upcoming-list{display:flex; flex-direction:column; gap:10px;}
  .upcoming-item{
    background:var(--night2); border-left:4px solid var(--tangerine); border-radius:8px;
    padding:12px 14px; cursor:pointer; transform:rotate(-0.3deg);
  }
  .upcoming-item:nth-child(even){border-left-color:var(--pink); transform:rotate(0.4deg);}
  .upcoming-item .d{font-family:'Bungee', cursive; font-size:12px; color:var(--yellow); letter-spacing:0.5px;}
  .upcoming-item .n-list{margin-top:6px; display:flex; flex-direction:column; gap:4px;}
  .upcoming-item .n-single{font-size:13px; color:var(--cream); line-height:1.4;}
  .upcoming-item .n-who{font-family:'Bungee', cursive; font-size:10px; color:var(--pink);}
  .empty{
    text-align:center;
    color:var(--cream-dim);
    font-size:13px;
    padding:20px 0;
  }

  footer{
    margin-top:50px;
    text-align:center;
    font-size:11px;
    color:var(--cream-dim);
    letter-spacing:1px;
  }
</style>
</head>
<body>

<div class="stripe"></div>

<div class="wrap">
  <div class="topbar">
    <a class="back-link" href="index.html">&larr; GERI</a>
  </div>

  <div class="page-title">
    <h1>TAKVIM</h1>
  </div>
  <div class="page-sub">bulusmak istediginiz gunleri isaretleyin, altina not birakin</div>

  <div class="calendar-box">
    <div class="calendar-nav">
      <button type="button" id="calPrev" aria-label="Onceki ay">&#8592;</button>
      <div class="calendar-month-label" id="calMonthLabel">-- --</div>
      <button type="button" id="calNext" aria-label="Sonraki ay">&#8594;</button>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <div class="day-editor" id="dayEditor">
    <div class="day-editor-title" id="dayEditorTitle">--</div>
    
    <label class="mark-label">
      <input type="checkbox" id="dayMarked"> Bulusma gunu olarak isaretle
    </label>

    <div class="note-form">
      <select id="whoSelect">
        <option value="ERKEK BAZUZU">ERKEK BAZUZU yaziyor</option>
        <option value="KADIN BAZUZU">KADIN BAZUZU yaziyor</option>
      </select>
      <textarea id="dayNoteInput" placeholder="Bu gun icin not ekle..." maxlength="280"></textarea>
      <button type="button" id="btnAddNote">NOT EKLE</button>
    </div>

    <div style="font-size:12px; color:var(--cream-dim); font-family:'Bungee', cursive; margin-bottom:6px;">BU GUNUN NOTLARI:</div>
    <div class="notes-list" id="dayNotesList">
      <div style="font-size:12px; color:var(--cream-dim);">Henuz not yok.</div>
    </div>

    <div class="day-editor-status" id="dayEditorStatus"></div>
  </div>

  <div class="upcoming-title">YAKLASAN BULUSMA GUNLERI</div>
  <div class="upcoming-list" id="upcomingList">
    <div class="empty">Yukleniyor...</div>
  </div>

  <footer>ozlem burosu &middot; takvim dosyasi &middot; hic bos gecmesin</footer>
</div>

<script>
  var FIREBASE_URL = "https://bazuzu-3cfbe-default-rtdb.firebaseio.com/";
  var TAKVIM_KEY = "serra-ozlem-takvim";

  var calendarData = {};
  var viewYear, viewMonth;
  var selectedDateStr = null;

  var monthNames = ["Ocak","Subat","Mart","Nisan","Mayis","Haziran","Temmuz","Agustos","Eylul","Ekim","Kasim","Aralik"];
  var dowNames = ["Pzt","Sal","Car","Per","Cum","Cmt","Paz"];

  function escapeHtml(str){
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function pad2(n){ return n < 10 ? "0" + n : "" + n; }
  function dateKey(y, m, d){ return y + "-" + pad2(m + 1) + "-" + pad2(d); }

  function formatDateTr(key){
    var p = key.split("-");
    var d = new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2]));
    return d.toLocaleDateString("tr-TR", { day:"numeric", month:"long", year:"numeric", weekday:"long" });
  }

  function itemUrl(key){
    return FIREBASE_URL + TAKVIM_KEY + "/" + encodeURIComponent(key) + ".json";
  }
  function collectionUrl(){
    return FIREBASE_URL + TAKVIM_KEY + ".json";
  }

  var now0 = new Date();
  viewYear = now0.getFullYear();
  viewMonth = now0.getMonth();

  function getEntryNotes(entry){
    if(!entry) return [];
    if(entry.notes && Array.isArray(entry.notes)) return entry.notes;
    // Eski veri formatı desteği (tek not varsa diziye dönüştür)
    if(entry.note) return [{ id: 'legacy-1', who: 'OZLEM BUROSU', text: entry.note, ts: entry.ts || Date.now() }];
    return [];
  }

  function renderCalendar(){
    document.getElementById("calMonthLabel").textContent = monthNames[viewMonth] + " " + viewYear;
    var grid = document.getElementById("calendarGrid");
    var html = "";
    dowNames.forEach(function(dn){ html += '<div class="calendar-dow">' + dn + "</div>"; });

    var now = new Date();
    var todayKey = dateKey(now.getFullYear(), now.getMonth(), now.getDate());

    var firstDay = new Date(viewYear, viewMonth, 1);
    var offset = (firstDay.getDay() + 6) % 7;
    var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    for(var i = 0; i < offset; i++){ html += '<div class="calendar-day empty"></div>'; }
    for(var d = 1; d <= daysInMonth; d++){
      var key = dateKey(viewYear, viewMonth, d);
      var entry = calendarData[key];
      var notes = getEntryNotes(entry);
      var cls = "calendar-day";
      if(key === todayKey) cls += " today";
      if(entry && entry.marked) cls += " marked";
      if(key === selectedDateStr) cls += " selected";
      html += '<div class="' + cls + '" data-date="' + key + '">' + d + (notes.length > 0 ? '<span class="dot"></span>' : "") + "</div>";
    }
    grid.innerHTML = html;

    grid.querySelectorAll(".calendar-day:not(.empty)").forEach(function(cell){
      cell.addEventListener("click", function(){
        selectedDateStr = cell.getAttribute("data-date");
        renderCalendar();
        openDayEditor(selectedDateStr);
      });
    });

    renderUpcoming();
  }

  document.getElementById("calPrev").addEventListener("click", function(){
    viewMonth--; if(viewMonth < 0){ viewMonth = 11; viewYear--; }
    renderCalendar();
  });
  document.getElementById("calNext").addEventListener("click", function(){
    viewMonth++; if(viewMonth > 11){ viewMonth = 0; viewYear++; }
    renderCalendar();
  });

  function renderNotesList(key){
    var entry = calendarData[key];
    var notes = getEntryNotes(entry);
    var container = document.getElementById("dayNotesList");
    
    if(notes.length === 0){
      container.innerHTML = '<div style="font-size:12px; color:var(--cream-dim);">Henuz not yok.</div>';
      return;
    }

    container.innerHTML = notes.map(function(n){
      return '<div class="note-item">' +
        '<div>' +
          '<div class="who">' + escapeHtml(n.who || 'ISIMSIZ') + '</div>' +
          '<div class="txt">' + escapeHtml(n.text || '') + '</div>' +
        '</div>' +
        '<button type="button" class="del-btn" data-note-id="' + escapeHtml(n.id) + '">SIL</button>' +
      '</div>';
    }).join('');
  }

  function openDayEditor(key){
    var editor = document.getElementById("dayEditor");
    editor.classList.add("show");
    var entry = calendarData[key] || { marked:false };
    document.getElementById("dayEditorTitle").textContent = formatDateTr(key);
    document.getElementById("dayMarked").checked = !!entry.marked;
    document.getElementById("dayNoteInput").value = "";
    document.getElementById("dayEditorStatus").textContent = "";
    
    renderNotesList(key);
    editor.scrollIntoView({ behavior:"smooth", block:"nearest" });
  }

  // Marked Checkbox değiştirilince doğrudan kaydet
  document.getElementById("dayMarked").addEventListener("change", async function(){
    if(!selectedDateStr) return;
    var statusEl = document.getElementById("dayEditorStatus");
    statusEl.textContent = "Güncelleniyor...";
    
    if(!calendarData[selectedDateStr]) calendarData[selectedDateStr] = { marked: false, notes: [] };
    calendarData[selectedDateStr].marked = this.checked;
    
    try{
      await fetch(itemUrl(selectedDateStr), {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(calendarData[selectedDateStr])
      });
      statusEl.textContent = "Güncellendi!";
      renderCalendar();
      setTimeout(function(){ statusEl.textContent = ""; }, 1500);
    }catch(e){
      statusEl.textContent = "Sorun oluştu.";
    }
  });

  // Not Ekleme Butonu
  document.getElementById("btnAddNote").addEventListener("click", async function(){
    if(!selectedDateStr) return;
    var text = document.getElementById("dayNoteInput").value.trim();
    var who = document.getElementById("whoSelect").value;
    var statusEl = document.getElementById("dayEditorStatus");

    if(!text){
      statusEl.textContent = "Önce bir not yazın...";
      return;
    }

    this.disabled = true;
    statusEl.textContent = "Not ekleniyor...";

    if(!calendarData[selectedDateStr]) {
      calendarData[selectedDateStr] = { marked: false, notes: [] };
    }
    
    var currentNotes = getEntryNotes(calendarData[selectedDateStr]);
    var newNote = {
      id: "note-" + Date.now() + "-" + Math.random().toString(36).slice(2,6),
      who: who,
      text: text,
      ts: Date.now()
    };
    
    currentNotes.push(newNote);
    calendarData[selectedDateStr].notes = currentNotes;
    delete calendarData[selectedDateStr].note; // Legacy temizliği

    try{
      await fetch(itemUrl(selectedDateStr), {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(calendarData[selectedDateStr])
      });
      document.getElementById("dayNoteInput").value = "";
      statusEl.textContent = "Not eklendi!";
      renderNotesList(selectedDateStr);
      renderCalendar();
      setTimeout(function(){ statusEl.textContent = ""; }, 1500);
    }catch(e){
      statusEl.textContent = "Not eklenemedi, tekrar deneyin.";
    }finally{
      this.disabled = false;
    }
  });

  // Not Silme İşlemi
  document.getElementById("dayNotesList").addEventListener("click", async function(e){
    var btn = e.target.closest(".del-btn");
    if(!btn) return;
    var noteId = btn.getAttribute("data-note-id");
    if(!noteId || !selectedDateStr) return;

    if(!confirm("Bu notu silmek istiyor musun?")) return;

    var statusEl = document.getElementById("dayEditorStatus");
    statusEl.textContent = "Not siliniyor...";

    var currentNotes = getEntryNotes(calendarData[selectedDateStr]);
    var updatedNotes = currentNotes.filter(function(n){ return n.id !== noteId; });
    
    calendarData[selectedDateStr].notes = updatedNotes;

    try{
      await fetch(itemUrl(selectedDateStr), {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(calendarData[selectedDateStr])
      });
      statusEl.textContent = "Not silindi!";
      renderNotesList(selectedDateStr);
      renderCalendar();
      setTimeout(function(){ statusEl.textContent = ""; }, 1500);
    }catch(e){
      statusEl.textContent = "Silinemedi, tekrar deneyin.";
    }
  });

  function renderUpcoming(){
    var list = document.getElementById("upcomingList");
    var now = new Date();
    var todayKey = dateKey(now.getFullYear(), now.getMonth(), now.getDate());
    var entries = Object.keys(calendarData)
      .filter(function(k){ return calendarData[k].marked && k >= todayKey; })
      .sort();

    if(entries.length === 0){
      list.innerHTML = '<div class="empty">Henuz isaretlenmis bulusma gunu yok.</div>';
      return;
    }

    list.innerHTML = entries.map(function(k){
      var entry = calendarData[k];
      var notes = getEntryNotes(entry);
      
      var notesHtml = notes.map(function(n){
        return '<div class="n-single"><span class="n-who">' + escapeHtml(n.who) + ':</span> ' + escapeHtml(n.text) + '</div>';
      }).join('');

      return '<div class="upcoming-item" data-date="' + k + '">' +
        '<div class="d">' + formatDateTr(k) + '</div>' +
        '<div class="n-list">' + (notesHtml || '<div class="n-single" style="color:var(--cream-dim);">Henüz not bırakılmamış.</div>') + '</div>' +
      '</div>';
    }).join("");

    list.querySelectorAll(".upcoming-item").forEach(function(item){
      item.addEventListener("click", function(){
        var k = item.getAttribute("data-date");
        var p = k.split("-");
        viewYear = parseInt(p[0]); viewMonth = parseInt(p[1]) - 1;
        selectedDateStr = k;
        renderCalendar();
        openDayEditor(k);
      });
    });
  }

  async function loadCalendar(){
    try{
      var res = await fetch(collectionUrl());
      if(!res.ok) throw new Error("Okuma basarisiz");
      var data = await res.json();
      calendarData = data || {};
    }catch(e){
      calendarData = {};
    }
    renderCalendar();
  }

  loadCalendar();
</script>

</body>
</html>
